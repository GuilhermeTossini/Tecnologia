<script>
    let codigo = Number.parseInt(prompt(`Informe o codigo do produto:\n 1 pao de batata\n 2 pao cara\n 3 pao média`))

    let quantidade = Number.parseInt(prompt(`Agora a quantidade por favor`))

    let valor

    if( codigo === 1){

        valor = 2.00
        
    } 

    else if(codigo === 2 ){
        valor = 1.50
    }

    else if (codigo === 3){
        valor = 1.00
    }

    else{
        alert(`Código invalido`)
    }

    let total = valor * quantidade
    
    alert(`Total: R$` + total.toFixed(2))
    
</script>
