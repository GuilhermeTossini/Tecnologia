<script>
    var n1, n2, nota, aprovadoreprovado, Aluno;

    Aluno = prompt("Primeiro diga o nome do aluno")
    n1 = Number.parseFloat(prompt("digite a primeira nota"));
    n2 = Number.parseFloat(prompt("Agora a segunda nota"));

    nota = n1 + n2;

    if (nota >= 60.0)
        aprovadoreprovado = "Aprovado!";

    else
        aprovadoreprovado = "Reprovado!";

    alert(" O aluno " + Aluno + " com a nota " + nota + " esta " + aprovadoreprovado)

</script>
