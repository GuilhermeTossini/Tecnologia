<script>

    f = (c * 9 /5) + 32
    alert("A temperatura em F é "  + f.toFixed(2) + 'F')
    }

    else if(temperatura ==='F'){
         f = parseFloat(prompt("digite a temperatura em Fahrenheit"))
    c = (f  - 32  ) * 5 / 9
    alert("A temperatura em C é "  + f.toFixed(2) + 'C')

    }

    }
</script>
