<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>
<body>
    <script>
        let x,y;
        do{
            x = Number.parseInt(prompt("Digite o valor de X: "))
            y = Number.parseInt(prompt("Digite o valor de Y "))
            if (x < y){
                alert("CRESCENTE")
            } else if (x > y) {
                alert("DECRESCENTE")
            }
        } while (x != y)
    </script>
    
</body>
</html>
