<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>
    <script>
        let x = Number(prompt("Digite o valor x"))
        let y = Number(prompt("Digite o valor de y"))

        if(x > y){
            let temp = x
            x=y
            y = temp
        }

        let soma = 0
        for (let i = x + 1; i < y; i++){
            if(i % 2 !==0){
                soma += i
            }
        }

        alert("A soma é" + soma)

    </script>        

   
    
</body>
</html>
